apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // Bundle JS for all variants (including debug) so Metro isn't required
    debuggableVariants = []
    entryFile = file("../../index.js")
    root = file("../../")
}

def enableProguardInReleaseBuilds = false
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.simulation.mobile"

    defaultConfig {
        applicationId "com.simulation.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 19
        versionName "0.2.1"
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            def keystoreCandidates = [
                System.getProperty("user.home") + '/Documents/gama-signing/release.keystore',
                System.getProperty("user.home") + '/Documents/Documents - m5pro/gama-signing/release.keystore',
                System.getProperty("user.home") + '/Documents/playstore signing/release.keystore'
            ]
            def keystorePath = keystoreCandidates.find { new File(it).exists() }
            if (keystorePath != null) {
                storeFile file(keystorePath)
                storePassword 'gama2026'
                keyAlias 'gama-release'
                keyPassword 'gama2026'
            } else {
                logger.warn("release.keystore not found in: " + keystoreCandidates + " — release signing unavailable")
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

// ─── Google Play 16KB page size fix (AGP < 8.5) ───────────────────────
// Patches ELF PT_LOAD p_align from 4KB to 16KB on merged native libs so
// Play's checker passes. Bundled libs (RN 0.74.5) ship 4KB-aligned.
tasks.whenTaskAdded { task ->
    if (task.name.startsWith('merge') && task.name.endsWith('NativeLibs')) {
        task.doLast {
            def raw = task.name.substring('merge'.length(), task.name.length() - 'NativeLibs'.length())
            def variant = raw.substring(0, 1).toLowerCase() + raw.substring(1)

            def mergedDir = new File(buildDir, "intermediates/merged_native_libs/${variant}/${task.name}/out/lib")
            if (!mergedDir.exists()) {
                mergedDir = new File(buildDir, "intermediates/merged_native_libs/${variant}/out/lib")
            }

            if (mergedDir.exists()) {
                println "16KB ELF patch: scanning ${mergedDir}"
                exec {
                    commandLine 'python3',
                        "${rootProject.projectDir}/../scripts/patch_elf_16kb.py",
                        mergedDir.absolutePath
                }
            } else {
                println "16KB ELF patch: directory not found, skipping"
            }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // Kotlin coroutines
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")

    // AndroidX
    implementation("androidx.core:core-ktx:1.12.0")
    implementation("androidx.appcompat:appcompat:1.6.1")
}

apply from: file("../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)
